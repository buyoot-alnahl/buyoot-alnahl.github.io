<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>بيوت النحل</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
  font-family:Tajawal;
  background:#0a0c10;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.wrap{width:400px}

.links{display:flex;flex-direction:column;gap:12px;margin-top:20px}

.btn{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px;
  border-radius:16px;
  text-decoration:none;
  color:#fff;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  cursor:pointer;
}

.btn-content{display:flex;gap:12px;align-items:center}

.btn-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:#0003;border-radius:12px}

.btn-icon i{font-size:20px}

.btn-arrow{opacity:.6}

/* TikTok */
.tiktok-btn{background:linear-gradient(#00f2ea20,#ff005020)}
/* Instagram */
.instagram-btn{background:linear-gradient(#e1306c20,#f5a62310)}
/* Email */
.email-btn{background:linear-gradient(#f5a62320,#c4841d10)}

/* SNAP */
.snap-wrap{position:relative}

.snap-hover-card{
  position:absolute;
  left:100%;
  top:50%;
  transform:translateY(-50%);
  width:200px;
  background:#111;
  padding:10px;
  border-radius:16px;
  opacity:0;
  visibility:hidden;
  transition:.3s;
}

.snap-hover-img{width:100%;border-radius:12px;background:#fff;padding:5px}

.snap-wrap:hover .snap-hover-card{
  opacity:1;
  visibility:visible;
}

/* hide on mobile */
@media (hover:none){
  .snap-hover-card{display:none}
}

/* toast */
.copy-toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  padding:10px 20px;
  border-radius:12px;
  opacity:0;
  transition:.3s;
}

.copy-toast.show{opacity:1}
</style>
</head>

<body>

<div class="wrap">

<h2>🍯 بيوت النحل</h2>

<div class="links">

<!-- متجر -->
<button class="btn">
  <span class="btn-content">
    <span class="btn-icon"><i class="fa fa-store"></i></span>
    <span>المتجر الإلكتروني</span>
  </span>
</button>

<!-- TikTok -->
<a class="btn tiktok-btn"
href="https://www.tiktok.com/@buyoot_alnahl" target="_blank">
<span class="btn-content">
<span class="btn-icon"><i class="fa-brands fa-tiktok"></i></span>
<span>تابعنا على تيك توك</span>
</span>
</a>

<!-- Instagram -->
<a class="btn instagram-btn"
href="https://www.instagram.com/buyoot_alnahl/" target="_blank">
<span class="btn-content">
<span class="btn-icon"><i class="fa-brands fa-instagram"></i></span>
<span>تابعنا على إنستقرام</span>
</span>
</a>

<!-- Snapchat -->
<div class="snap-wrap">
<a class="btn"
href="https://www.snapchat.com/add/buyoot_alnahl" target="_blank">
<span class="btn-content">
<span class="btn-icon"><i class="fa-brands fa-snapchat"></i></span>
<span>تابعنا على سناب</span>
</span>
</a>

<div class="snap-hover-card">
<img src="snapcode.png" class="snap-hover-img">
</div>
</div>

<!-- Email -->
<a class="btn email-btn"
href="mailto:afhoney@wafamc.com"
id="emailBtn"
data-email="afhoney@wafamc.com">

<span class="btn-content">
<span class="btn-icon"><i class="fa fa-envelope"></i></span>
<span>راسلنا عبر البريد</span>
</span>
</a>

<!-- WhatsApp -->
<button class="btn">
<span class="btn-content">
<span class="btn-icon"><i class="fa-brands fa-whatsapp"></i></span>
<span>واتساب</span>
</span>
</button>

</div>
</div>

<!-- toast -->
<div id="copyToast" class="copy-toast">تم النسخ</div>

<script>

const emailBtn = document.getElementById("emailBtn");
const toast = document.getElementById("copyToast");

emailBtn.addEventListener("click", async (e)=>{

const isTouch = window.matchMedia("(hover:none)").matches;

if(isTouch) return;

e.preventDefault();

await navigator.clipboard.writeText(emailBtn.dataset.email);

toast.classList.add("show");

setTimeout(()=>{
toast.classList.remove("show");
},2000);

});

</script>

</body>
</html>
